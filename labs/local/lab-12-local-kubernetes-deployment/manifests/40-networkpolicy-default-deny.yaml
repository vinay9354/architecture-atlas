# Default deny: selects every Pod in the namespace and allows no ingress and no egress.
# Everything that must work is then allowed explicitly in 41-networkpolicy-allow.yaml.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: atlas-tracking-lab
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
