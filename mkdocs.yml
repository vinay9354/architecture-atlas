# Architecture Atlas - MkDocs configuration
# Stack decision: docs/appendices/adr/adr-0001-documentation-stack.md
site_name: Architecture Atlas
site_description: >-
  An open-source, visual-first learning repository for Solutions Architecture, system design,
  cloud, data, and AI architecture.
site_url: https://vinay9354.github.io/architecture-atlas/
repo_url: https://github.com/vinay9354/architecture-atlas
repo_name: vinay9354/architecture-atlas
edit_uri: edit/main/docs/
copyright: >-
  Text and original diagrams © Architecture Atlas contributors, CC BY 4.0.
  Code and configuration MIT. See LICENSE and LICENSE-DOCS.md.

docs_dir: docs
site_dir: site
strict: false # CI runs `mkdocs build --strict`; keep local serve forgiving.

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn
  nav:
    omitted_files: warn
    not_found: warn
    absolute_links: warn

theme:
  name: material
  language: en
  # No external font download: keeps the site free of third-party requests and works offline.
  font: false
  icon:
    logo: material/map-outline
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: deep orange
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: deep orange
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - navigation.tracking
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.tabs.link
    - content.action.edit

extra_css:
  - stylesheets/extra.css

plugins:
  - search:
      separator: '[\s\-,:!=\[\]()"/]+|(?!\b)(?=[A-Z][a-z])|\.(?!\d)|&[lg]t;'
  - tags

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.snippets:
      check_paths: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

