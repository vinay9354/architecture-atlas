# Validates content and builds the documentation site on every push and pull request.
# Action versions last verified: 2026-11-15 (setup-terraform v4.0.1 added 2026-11-21).
# Checkout depth changed 2026-11-20 for gitleaks.
name: Docs build and validation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # gitleaks scans the pushed commit range, so it needs history, not a shallow clone.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install documentation toolchain
        run: python -m pip install -r requirements.txt

      - name: Validate content (coverage, metadata, links, diagrams)
        run: |
          python scripts/validate-content.py
          python scripts/build-coverage.py --check
          python scripts/check-assets.py

      # Lab 15's smoke test runs terraform fmt/validate/test on a provider-free module (no downloads,
      # no credentials). Pinned to the version the lab was verified with.
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.15.6"
          terraform_wrapper: false

      - name: Unit tests
        run: python -m unittest discover -s tests -v

      - name: Build site (strict - warnings fail the build)
        run: mkdocs build --strict

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Markdown lint
        run: npx --yes markdownlint-cli2@0.17.2

      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload built site as artifact
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: site/
          retention-days: 7
