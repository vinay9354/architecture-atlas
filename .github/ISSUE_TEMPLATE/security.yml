name: Security issue (non-sensitive only)
description: For exploitable vulnerabilities use private reporting (see SECURITY.md). Use this only for non-sensitive hardening suggestions.
title: "[Security hardening]: "
labels: ["security"]
body:
  - type: markdown
    attributes:
      value: |
        **Do not post exploit details here.** Report vulnerabilities privately through
        [GitHub Security Advisories](https://github.com/vinay9354/architecture-atlas/security/advisories/new)
        as described in SECURITY.md.
  - type: textarea
    id: suggestion
    attributes:
      label: Hardening suggestion
      description: Example - a lab instruction that encourages an insecure default, or a CI permission that is broader than needed.
    validations:
      required: true
