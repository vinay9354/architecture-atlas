name: Accessibility issue
description: Something is hard to use with a keyboard, screen reader, small screen, or reduced motion.
title: "[A11y]: "
labels: ["accessibility"]
body:
  - type: input
    id: page
    attributes:
      label: Page URL or path
    validations:
      required: true
  - type: textarea
    id: issue
    attributes:
      label: Describe the barrier
      description: What were you trying to do, with which assistive technology or device, and what blocked you?
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: Suggested improvement (optional)
