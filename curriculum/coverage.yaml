- id: D30
  title: Architecture design method
  section: system-design-exercises
  topics:
  - id: D30-T01
    title: Architecture design method
    status: Planned
    destination: docs/system-design-exercises/design-method.md
    inventory: >-
      Design method sequence: (1) Understand the business problem, users, stakeholders, and outcome. →
      (2) Gather functional requirements, NFRs, assumptions, constraints, and risks. → (3) Estimate users,
      requests/second, concurrency, storage, bandwidth, growth, and peak load. → (4) Define system boundaries,
      domains, services, and responsibilities. → (5) Design APIs, events, protocols, and integration contracts.
      → (6) Design data models, databases, storage, replication, indexes, and caching. → (7) Select the
      architecture style and explain why. → (8) Design compute, network, cloud services, regions, and
      deployment. → (9) Define identity, authorization, encryption, secrets, and trust boundaries. → (10)
      Design scaling, resilience, failover, DR, and performance. → (11) Design CI/CD, IaC, observability,
      support, and operations. → (12) Estimate costs, document trade-offs, validate assumptions, and record
      ADRs.
  - id: D30-T02
    title: AI system design decisions
    status: Planned
    destination: docs/system-design-exercises/design-method.md
    inventory: >-
      For AI systems, additionally decide on model selection, managed vs self-hosted, RAG vs fine-tuning,
      retrieval/data permissions, agent autonomy and approvals, tool permissions, evaluation, safety/guardrails,
      inference capacity, model fallback, and AI cost controls.
